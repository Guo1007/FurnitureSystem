spring:
  # 邮件配置（发送验证码等）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Thymeleaf 配置（邮件模板）
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true

  # 异步任务线程池（@Async 使用，避免 SimpleAsyncTaskExecutor 无限创建线程）
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 200
      thread-name-prefix: async-

  web:
    resources:
      static-locations: classpath:/static/

  application:
    name: furniture-system

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/furniture-system?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:root}

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  type-aliases-package: gcy.system.entity
  configuration:
    map-underscore-to-camel-case: true

langchain4j:
  open-ai:
    streaming-chat-model:
      api-key: ${CHAT_AI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-flash
      log-requests: ${LANGCHAIN_LOG_REQUESTS:false}
      log-responses: ${LANGCHAIN_LOG_RESPONSES:false}
    chat-model:
      api-key: ${CHAT_AI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-flash
      log-requests: ${LANGCHAIN_LOG_REQUESTS:false}
      log-responses: ${LANGCHAIN_LOG_RESPONSES:false}
    embedding-model:
      api-key: ${EMBEDDING_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-text-embedding
      log-requests: ${LANGCHAIN_LOG_REQUESTS:false}
      log-responses: ${LANGCHAIN_LOG_RESPONSES:false}
      max-segments-per-batch: 10
  community:
    redis:
      host: ${LANGCHAIN_REDIS_HOST:localhost}
      port: ${LANGCHAIN_REDIS_PORT:6379}

logging:
  level:
    gcy.system: ${LOG_LEVEL_GCY:info}
    gcy.ai: ${LOG_LEVEL_GCY:info}
    dev.langchain4j: ${LOG_LEVEL_LANGCHAIN:warn}

# 阿里云 OSS 配置
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    key: ${OSS_ACCESS_KEY}
    secret: ${OSS_SECRET_KEY}
    bucket: ${OSS_BUCKET}
    url: ${OSS_URL}

# RocketMQ 配置
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: furniture-producer

# 订单配置
order:
  payment-timeout-minutes: 1440  # 未支付订单超时自动取消（分钟），默认 24 小时

# ==================== 支付宝支付配置 ====================
alipay:
  app-id: ${ALIPAY_APP_ID}
  app-private-key: ${ALIPAY_APP_PRIVATE_KEY}
  alipay-public-key: ${ALIPAY_ALIPAY_PUBLIC_KEY}
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: ${ALIPAY_NOTIFY_URL}

server:
  port: 8081

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 家具商城API
      paths-to-match: /**

# Knife4j 增强配置
knife4j:
  enable: false
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-footer: false
    footer-custom-content: 家具商城 | Powered by Knife4j

# 应用自定义配置
app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://mingcheng.asia
      - https://mingcheng.asia
      - http://www.mingcheng.asia
      - https://www.mingcheng.asia
